  <script>
    (function () {
      try {
        if (localStorage.getItem("tools:theme") === "light")
          document.documentElement.setAttribute("data-theme", "light");
        if (localStorage.getItem("tools:headerSticky") === "off")
          document.documentElement.setAttribute("data-header-sticky", "off");
        var CC_KEY = "tools:cookie_consent", CC_VER = 1, CC_EXP = 365;
        var d = JSON.parse(localStorage.getItem(CC_KEY));
        if (d && d.version === CC_VER && (Date.now() - d.timestamp) < CC_EXP * 86400000) {
          window.__cookieConsent = { functional: !!d.functional, resolved: true };
          if (d.functional) document.documentElement.classList.add("consent-functional");
        } else { window.__cookieConsent = { functional: false, resolved: false }; }
      } catch (e) { window.__cookieConsent = { functional: false, resolved: false }; }
    })();
  </script>

  <style>
    /* ── app shell ───────────────────────────────────────────────────── */
    .hb-app {
      display: grid;
      grid-template-columns: 264px minmax(0, 1fr) 320px;
      gap: var(--space-md);
      align-items: stretch;
      height: clamp(560px, calc(100vh - 200px), 1100px);
      margin-top: var(--space-md);
    }
    .hb-app > .panel { padding: 0; display: flex; flex-direction: column; overflow: hidden; }

    .hb-pane-head {
      display: flex; align-items: center; gap: var(--space-xs);
      padding: var(--space-sm) var(--space-sm);
      border-bottom: 1px solid var(--c-border);
      flex-wrap: wrap;
    }
    .hb-left__body, .hb-right__body, .hb-pal, #hb-layers { overflow: auto; }
    .hb-left__body { flex: 1; min-height: 0; }
    .hb-left__body > [hidden] { display: none; }

    /* ── palette ─────────────────────────────────────────────────────── */
    .hb-pal { padding: var(--space-sm); display: flex; flex-direction: column; gap: var(--space-md); }
    .hb-pal__items { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-xs); margin-top: var(--space-xs); }
    .hb-pal__item {
      font-family: var(--f-mono); font-size: 0.72rem; text-align: left;
      padding: 0.4rem 0.55rem; border: 1px solid var(--c-border); border-radius: var(--border-radius-sm);
      background: rgba(255,255,255,0.03); color: var(--c-text-muted); cursor: grab; transition: all var(--transition-fast);
    }
    .hb-pal__item:hover { color: var(--c-accent); border-color: var(--c-accent-border); background: var(--c-accent-bg); }
    .hb-pal__item--preset { grid-column: span 2; color: var(--c-text); }

    /* ── layers tree ─────────────────────────────────────────────────── */
    #hb-layers { padding: var(--space-xs); flex: 1; min-height: 0; }
    .hb-tree__row {
      display: flex; align-items: center; gap: 4px; height: 26px;
      font-family: var(--f-mono); font-size: 0.74rem; color: var(--c-text-muted);
      border-radius: var(--border-radius-sm); cursor: pointer; user-select: none; padding-right: 6px;
    }
    .hb-tree__row:hover { background: rgba(255,255,255,0.04); color: var(--c-text); }
    .hb-tree__row.is-selected { background: var(--c-accent-bg); color: var(--c-accent); }
    .hb-tree__tog { width: 14px; text-align: center; color: var(--c-text-faint); flex: 0 0 auto; }
    .hb-tree__icon { width: 12px; color: var(--c-text-faint); flex: 0 0 auto; font-size: 0.7rem; }
    .hb-tree__label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hb-tree__row.drop-before { box-shadow: inset 0 2px 0 var(--c-accent); }
    .hb-tree__row.drop-after { box-shadow: inset 0 -2px 0 var(--c-accent); }
    .hb-tree__row.drop-inside { outline: 1px solid var(--c-accent); outline-offset: -1px; }

    /* ── center: toolbar + canvas ────────────────────────────────────── */
    .hb-center { min-width: 0; }
    .hb-toolbar {
      display: flex; align-items: center; gap: var(--space-sm); flex-wrap: wrap;
      padding: var(--space-sm); border-bottom: 1px solid var(--c-border);
    }
    .hb-toolbar .hb-spacer { flex: 1; }
    .hb-tool-btn {
      display: inline-flex; align-items: center; gap: 4px; padding: 0.35rem 0.55rem;
      font-size: 0.78rem; border: 1px solid var(--c-border); border-radius: var(--border-radius-sm);
      background: rgba(255,255,255,0.03); color: var(--c-text); cursor: pointer; transition: all var(--transition-fast);
    }
    .hb-tool-btn:hover:not(:disabled) { color: var(--c-accent); border-color: var(--c-accent-border); }
    .hb-tool-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .hb-tool-btn svg { width: 14px; height: 14px; }
    .hb-tool-btn.is-active { color: var(--c-accent); background: var(--c-accent-bg); border-color: var(--c-accent-border); }
    .hb-zoom { font-family: var(--f-mono); font-size: 0.72rem; color: var(--c-text-muted); min-width: 38px; text-align: center; }

    .hb-canvas-pane { position: relative; flex: 1; min-height: 0; overflow: hidden; background: repeating-conic-gradient(rgba(127,148,138,0.06) 0% 25%, transparent 0% 50%) 50% / 22px 22px; }
    [data-theme="light"] .hb-canvas-pane { background: repeating-conic-gradient(rgba(0,0,0,0.04) 0% 25%, transparent 0% 50%) 50% / 22px 22px; }
    .hb-stage { position: absolute; inset: 0; overflow: auto; padding: 24px 0; display: flex; justify-content: center; align-items: flex-start; }
    .hb-frame-wrap { box-shadow: 0 16px 48px -20px rgba(0,0,0,0.5); background: #fff; flex: 0 0 auto; }
    #hb-frame { display: block; width: 100%; height: 70vh; border: 0; background: #fff; }

    /* overlay layer — parent-drawn, never scrolls with stage */
    .hb-overlay { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
    .hb-ov { position: absolute; pointer-events: none; }
    .hb-ov--sel { outline: 1.5px solid var(--c-accent); }
    .hb-ov--hover { outline: 1px dashed rgba(74,222,128,0.6); }
    .hb-ov__label {
      position: absolute; top: -19px; left: -1.5px; font-family: var(--f-mono); font-size: 0.62rem;
      background: var(--c-accent); color: #06281a; padding: 1px 6px; border-radius: 3px 3px 0 0; white-space: nowrap;
    }
    .hb-ov__handle { position: absolute; width: 9px; height: 9px; background: var(--c-accent); border: 1px solid #06281a; border-radius: 2px; pointer-events: auto; }
    .hb-ov__handle--nw { left: -5px; top: -5px; cursor: nwse-resize; }
    .hb-ov__handle--ne { right: -5px; top: -5px; cursor: nesw-resize; }
    .hb-ov__handle--sw { left: -5px; bottom: -5px; cursor: nesw-resize; }
    .hb-ov__handle--se { right: -5px; bottom: -5px; cursor: nwse-resize; }
    .hb-ov__handle--e { right: -5px; top: 50%; margin-top: -4.5px; cursor: ew-resize; }
    .hb-ov__handle--s { bottom: -5px; left: 50%; margin-left: -4.5px; cursor: ns-resize; }
    .hb-ov__marker { position: absolute; background: var(--c-accent); pointer-events: none; border-radius: 1px; }
    .hb-ov__marker--inside { background: transparent; outline: 2px solid var(--c-accent); outline-offset: -1px; }

    /* ── inspector ───────────────────────────────────────────────────── */
    .hb-right__body { flex: 1; min-height: 0; overflow: auto; }
    .hb-insp { display: flex; flex-direction: column; }
    .hb-insp__empty { padding: var(--space-lg); color: var(--c-text-faint); font-size: 0.85rem; }
    .hb-insp__head { padding: var(--space-sm) var(--space-md); border-bottom: 1px solid var(--c-border); }
    .hb-insp__title { font-weight: 600; display: flex; align-items: center; gap: var(--space-sm); }
    .hb-insp__tag { font-family: var(--f-mono); font-size: 0.65rem; color: var(--c-text-faint); background: rgba(255,255,255,0.05); padding: 1px 6px; border-radius: 999px; }
    .hb-insp__layer { font-family: var(--f-mono); font-size: 0.68rem; color: var(--c-warning); margin-top: 4px; }
    .hb-tabs { display: flex; gap: var(--space-xs); padding: var(--space-sm) var(--space-md); border-bottom: 1px solid var(--c-border); }
    .hb-tab { text-transform: capitalize; }

    .hb-sec { border-bottom: 1px solid var(--c-border-light); }
    .hb-sec > summary { cursor: pointer; padding: var(--space-sm) var(--space-md); font-size: 0.78rem; font-weight: 600; list-style: none; user-select: none; }
    .hb-sec > summary::-webkit-details-marker { display: none; }
    .hb-sec > summary::before { content: "▸"; color: var(--c-text-faint); margin-right: 6px; font-size: 0.7rem; }
    .hb-sec[open] > summary::before { content: "▾"; }
    .hb-sec__body { padding: 0 var(--space-md) var(--space-sm); display: flex; flex-direction: column; gap: var(--space-sm); }

    .hb-ctrl { display: flex; flex-direction: column; gap: 3px; }
    .hb-ctrl__label { font-family: var(--f-mono); font-size: 0.66rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--c-text-faint); display: flex; align-items: center; gap: 5px; }
    .hb-input { font-size: 0.78rem; padding: 0.3rem 0.5rem; }
    select.hb-input { cursor: pointer; }
    .hb-ov-badge { width: 6px; height: 6px; border-radius: 999px; background: var(--c-warning); display: inline-block; }
    .hb-sides { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
    .hb-side { text-align: center; padding: 0.3rem 0.2rem; }
    .hb-side.is-over { border-color: var(--c-warning); }
    .hb-seg-row { display: flex; gap: 4px; flex-wrap: wrap; }
    .hb-seg { font-size: 0.68rem; }
    .hb-color { display: flex; align-items: center; gap: 5px; }
    .hb-color input[type="color"] { width: 30px; height: 30px; padding: 0; border: 1px solid var(--c-border); border-radius: var(--border-radius-sm); background: transparent; cursor: pointer; flex: 0 0 auto; }
    .hb-clear { flex: 0 0 auto; width: 26px; height: 26px; border: 1px solid var(--c-border); border-radius: var(--border-radius-sm); background: transparent; color: var(--c-text-faint); cursor: pointer; }
    .hb-clear:hover { color: var(--c-danger); }
    .hb-check { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--c-text-muted); }

    /* ── grid editor ─────────────────────────────────────────────────── */
    .hb-grid-ed { display: flex; flex-direction: column; gap: var(--space-sm); width: 100%; }
    .hb-grid-ax { display: flex; flex-direction: column; gap: 4px; }
    .hb-grid-ax__head { display: flex; align-items: center; justify-content: space-between; }
    .hb-grid-ax__btns { display: flex; gap: 4px; }
    .hb-grid-ax__btns .hb-tool-btn { padding: 0 0.5rem; line-height: 1.6; }
    .hb-grid-track { display: flex; gap: 4px; }
    .hb-grid-val { flex: 1; min-width: 0; }
    .hb-grid-unit { flex: 0 0 auto; width: 96px; }

    /* ── behaviors ───────────────────────────────────────────────────── */
    .hb-bhv { padding: var(--space-sm) var(--space-md); display: flex; flex-direction: column; gap: var(--space-sm); }
    .hb-bhv__hint { font-size: 0.76rem; color: var(--c-text-faint); margin: 0; }
    .hb-bhv__empty { font-size: 0.8rem; color: var(--c-text-faint); padding: var(--space-sm) 0; }
    .hb-bhv__row { border: 1px solid var(--c-border); border-radius: var(--border-radius-sm); padding: var(--space-sm); display: flex; flex-direction: column; gap: var(--space-xs); background: rgba(255,255,255,0.02); }
    .hb-bhv__line { display: flex; gap: 4px; align-items: center; }
    .hb-bhv__line select { flex: 1; }
    .hb-bhv__params { display: flex; flex-direction: column; gap: 4px; }
    .hb-bhv__target { display: flex; flex-direction: column; gap: 3px; }

    /* ── code modal ──────────────────────────────────────────────────── */
    .hb-modal { border: 1px solid var(--c-border); border-radius: var(--border-radius-lg); background: var(--c-surface); color: var(--c-text); padding: 0; width: min(900px, 92vw); max-height: 86vh; }
    .hb-modal::backdrop { background: rgba(0,0,0,0.55); backdrop-filter: blur(2px); }
    .hb-modal__head { display: flex; align-items: center; gap: var(--space-sm); padding: var(--space-md); border-bottom: 1px solid var(--c-border); }
    .hb-modal__head .hb-spacer { flex: 1; }
    .hb-modal__body { padding: var(--space-md); overflow: auto; max-height: 70vh; }
    .hb-code { font-family: var(--f-mono); font-size: 0.78rem; white-space: pre; overflow: auto; background: rgba(0,0,0,0.25); border: 1px solid var(--c-border); border-radius: var(--border-radius-sm); padding: var(--space-md); margin: 0; }
    [data-theme="light"] .hb-code { background: rgba(0,0,0,0.04); }

    /* ── responsive collapse ─────────────────────────────────────────── */
    @media (max-width: 1080px) {
      .hb-app { grid-template-columns: minmax(0, 1fr); height: auto; }
      .hb-center { order: 1; }
      .hb-left { order: 2; }
      .hb-right { order: 3; }
      .hb-canvas-pane { height: 60vh; }
      .hb-left__body, .hb-right__body { max-height: 340px; }
    }
  </style>
</head>

<body>

  <div id="backdrop" aria-hidden="true">
    <div class="grid-bg__sky"></div>
    <div class="grid-bg__plane"></div>
    <div class="grid-bg__scan"></div>
    <div class="grid-bg__spot"></div>
  </div>

  <div class="page">

    <main class="tool-main">
      <div class="shell">

        <section class="tool-header">
          <a href="/" class="tool-header__back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
            All tools
          </a>
          <div class="tool-title">
            <div class="tool-title__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 9h18"/><path d="m8 13 2 2-2 2"/><path d="M13 17h3"/></svg>
            </div>
            <div class="tool-title__text">
              <h1>HTML Builder</h1>
              <p>Design pages visually — drag elements, style every property, add interactions, export clean code.</p>
            </div>
            <button type="button" class="info-btn" data-info-button aria-label="About this tool" title="About this tool">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/></svg>
            </button>
          </div>
        </section>

        <section class="hb-app">

          <!-- LEFT: palette / layers -->
          <aside class="panel hb-left">
            <div class="hb-pane-head" role="tablist" aria-label="Left panel">
              <button type="button" class="chip" data-left-tab="palette" aria-pressed="true">Palette</button>
              <button type="button" class="chip" data-left-tab="layers" aria-pressed="false">Layers</button>
            </div>
            <div class="hb-left__body">
              <div data-pane="palette" id="hb-palette"></div>
              <div data-pane="layers" id="hb-layers" hidden></div>
            </div>
          </aside>

          <!-- CENTER: toolbar + canvas -->
          <section class="panel hb-center">
            <div class="hb-toolbar">
              <div class="chips" role="group" aria-label="Device">
                <button type="button" class="chip" data-device="desktop" aria-pressed="true">Desktop</button>
                <button type="button" class="chip" data-device="tablet" aria-pressed="false">Tablet</button>
                <button type="button" class="chip" data-device="mobile" aria-pressed="false">Mobile</button>
              </div>
              <div class="chips" role="group" aria-label="Zoom">
                <button type="button" class="hb-tool-btn" data-zoom="-1" aria-label="Zoom out">−</button>
                <span class="hb-zoom" id="hb-zoom-label">100%</span>
                <button type="button" class="hb-tool-btn" data-zoom="1" aria-label="Zoom in">+</button>
              </div>
              <div class="hb-spacer"></div>
              <button type="button" class="hb-tool-btn" id="hb-undo" title="Undo (Ctrl/Cmd+Z)" disabled>↶</button>
              <button type="button" class="hb-tool-btn" id="hb-redo" title="Redo (Ctrl/Cmd+Shift+Z)" disabled>↷</button>
              <button type="button" class="hb-tool-btn" id="hb-test" title="Test interactions">▶ Test</button>
              <button type="button" class="hb-tool-btn" id="hb-code">&lt;/&gt; Code</button>
              <button type="button" class="hb-tool-btn" id="hb-share">Share</button>
              <button type="button" class="hb-tool-btn" id="hb-export-html">Export HTML</button>
              <button type="button" class="hb-tool-btn" id="hb-export-zip">ZIP</button>
              <button type="button" class="hb-tool-btn" id="hb-reset" title="Clear the canvas">Reset</button>
            </div>
            <div class="hb-canvas-pane">
              <div class="hb-stage" id="hb-stage">
                <div class="hb-frame-wrap" id="hb-frame-wrap">
                  <iframe id="hb-frame" title="Page preview"></iframe>
                </div>
              </div>
              <div class="hb-overlay" id="hb-overlay"></div>
            </div>
          </section>

          <!-- RIGHT: inspector -->
          <aside class="panel hb-right">
            <div class="hb-right__body" id="hb-inspector"></div>
          </aside>

        </section>

        <div class="banner banner--info" id="hb-status" role="status" aria-live="polite" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
          <span id="hb-status-text"></span>
        </div>

      </div>
    </main>

  </div>

  <!-- code view modal -->
  <dialog class="hb-modal" id="hb-code-modal">
    <div class="hb-modal__head">
      <div class="chips" role="tablist" aria-label="Code">
        <button type="button" class="chip" data-code-tab="html" aria-pressed="true">HTML</button>
        <button type="button" class="chip" data-code-tab="css" aria-pressed="false">CSS</button>
        <button type="button" class="chip" data-code-tab="js" aria-pressed="false">JS</button>
      </div>
      <div class="hb-spacer"></div>
      <button type="button" class="btn btn--copy" id="hb-code-copy">Copy</button>
      <button type="button" class="btn btn--ghost" id="hb-code-close">Close</button>
    </div>
    <div class="hb-modal__body">
      <pre class="hb-code" id="hb-code-out"></pre>
    </div>
  </dialog>

  <script defer src="/assets/js/partials.js"></script>
  <script defer src="/assets/js/cookie-consent.js"></script>
  <script defer src="/assets/js/search.js"></script>
  <script type="module" src="/assets/js/main.js"></script>
  <script type="module" src="/assets/js/info-modal.js"></script>
  <script type="module" src="./tool.js"></script>
</body>
</html>
