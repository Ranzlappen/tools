<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Color Picker · tools · ranzlappen</title>
  <meta name="description" content="Pick, convert between HEX, RGB, HSL, OKLCH, HSV — and check WCAG contrast." />
  <meta name="theme-color" content="#0b1210" />
  <meta name="color-scheme" content="dark light" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Color Picker · tools · ranzlappen" />
  <meta property="og:description" content="Pick, convert between HEX, RGB, HSL, OKLCH, HSV — and check WCAG contrast." />
  <meta property="og:url" content="https://tools.ranzlappen.com/tools/color-picker/" />
  <meta property="og:site_name" content="ranzlappen tools" />
  <meta property="og:image" content="https://tools.ranzlappen.com/assets/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="ranzlappen tools — Small tools, sharp edges." />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Color Picker · tools · ranzlappen" />
  <meta name="twitter:description" content="Pick, convert between HEX, RGB, HSL, OKLCH, HSV — and check WCAG contrast." />
  <meta name="twitter:image" content="https://tools.ranzlappen.com/assets/og.png" />


  <script>
    (function () {
      try {
        if (localStorage.getItem("tools:theme") === "light") {
          document.documentElement.setAttribute("data-theme", "light");
        }
      } catch (e) {}
    })();
  </script>

  <link rel="icon" type="image/png" href="../../assets/icon.png" />
  <link rel="apple-touch-icon" href="../../assets/icon.png" />

  <link rel="stylesheet" href="../../assets/css/style.css" />
  <link rel="stylesheet" href="../../assets/css/backdrops.css" />
  <link rel="stylesheet" href="../../assets/css/tool.css" />
</head>

<body>

  <div id="backdrop" aria-hidden="true">
    <div class="grid-bg__sky"></div>
    <div class="grid-bg__plane"></div>
    <div class="grid-bg__scan"></div>
    <div class="grid-bg__spot"></div>
  </div>

  <div class="page">

    <header class="site-header">
      <div class="shell site-header__inner">
        <a href="/" class="brand" aria-label="ranzlappen tools home">
          <span class="brand__mark" aria-hidden="true"><img src="../../assets/icon.png" alt="" width="32" height="32" /></span>
          <span class="brand__name">ranzlappen<span class="brand__sub"> / tools</span></span>
        </a>
        <div class="header-actions">
          <button type="button" class="theme-toggle" aria-label="Switch to light theme" aria-pressed="false" title="Toggle theme">
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg class="icon-sun"  viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          </button>
          <span class="site-header__meta">tools.ranzlappen.com</span>
        </div>
      </div>
    </header>

    <main class="tool-main">
      <div class="shell">

        <section class="tool-header">
          <a href="../../" class="tool-header__back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
            All tools
          </a>
          <div class="tool-title">
            <div class="tool-title__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r="2.5"/><circle cx="19" cy="13" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="10" cy="20" r="2.5"/><path d="M12 2a10 10 0 1 0 0 20 4 4 0 0 0 0-8 2 2 0 0 1 0-4 4 4 0 0 0 0-8z"/></svg>
            </div>
            <div class="tool-title__text">
              <h1>Color Picker</h1>
              <p>Pick a color, see every format, check WCAG contrast against any partner.</p>
            </div>
          </div>
        </section>

        <section class="panel stack-lg">
          <div class="panel__head">
            <span class="panel__title">Foreground color</span>
            <div class="btn-row">
              <input type="color" id="fg-input" value="#4ade80" class="input input--single" style="width: 56px; padding: 0; height: 36px; cursor: pointer;" aria-label="Foreground color"/>
              <input type="text" id="fg-text" class="input input--single input--mono" style="max-width: 140px;" value="#4ade80" aria-label="Foreground color hex" />
            </div>
          </div>

          <div class="color-grid">
            <div id="fg-preview" class="color-preview" style="background: #4ade80;"></div>
            <div class="color-formats" id="fg-formats"></div>
          </div>
        </section>

        <section class="panel stack-md" style="margin-top: var(--space-lg);">
          <div class="panel__head">
            <span class="panel__title">Contrast check</span>
            <input type="color" id="bg-input" value="#0b1210" class="input input--single" style="width: 56px; padding: 0; height: 36px; cursor: pointer;" aria-label="Background color"/>
          </div>

          <div class="contrast-row">
            <div>
              <div id="contrast-preview" style="
                padding: var(--space-lg);
                border-radius: var(--border-radius-lg);
                border: 1px solid var(--c-border);
                background: #0b1210;
                color: #4ade80;
                font-family: var(--f-body);
              ">
                <div style="font-size: 1.6rem; font-weight: 600;">Large text</div>
                <div style="font-size: 0.95rem; margin-top: 0.5rem;">Body text at 16 pixels.</div>
              </div>
            </div>
            <div>
              <div class="contrast-ratio" id="contrast-ratio">—</div>
              <div class="contrast-badges" id="contrast-badges"></div>
            </div>
          </div>
        </section>

      </div>
    </main>

    <footer class="site-footer">
      <div class="shell site-footer__inner">
        <span>Built by <a href="https://ranzlappen.com">Ranzlappen</a>.</span>
        <span><a href="https://github.com/Ranzlappen/tools">source</a> · MIT licensed</span>
      </div>
    </footer>

  </div>


  <script type="module" src="../../assets/js/main.js"></script>
  <script type="module" src="./tool.js"></script>
</body>
</html>
