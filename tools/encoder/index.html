<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <meta name="description" content="Convert text between Base64, Hex, URL, Binary, and ASCII encodings (UTF-8 safe)." />

  <meta name="color-scheme" content="dark light" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Multi-Encoder · tools · ranzlappen" />
  <meta property="og:description" content="Convert text between Base64, Hex, URL, Binary, and ASCII encodings (UTF-8 safe)." />
  <meta property="og:url" content="https://tools.ranzlappen.com/tools/encoder/" />
  <meta property="og:site_name" content="ranzlappen tools" />
  <meta property="og:image" content="https://tools.ranzlappen.com/assets/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="ranzlappen tools — Small tools, sharp edges." />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Multi-Encoder · tools · ranzlappen" />
  <meta name="twitter:description" content="Convert text between Base64, Hex, URL, Binary, and ASCII encodings (UTF-8 safe)." />
  <meta name="twitter:image" content="https://tools.ranzlappen.com/assets/og.png" />


  <script>
    (function () {
      try {
        if (localStorage.getItem("tools:theme") === "light") {
          document.documentElement.setAttribute("data-theme", "light");
        }
      } catch (e) {}
    })();
  </script>

  <link rel="icon" type="image/png" href="../../assets/icon.png" />
  <link rel="apple-touch-icon" href="../../assets/icon.png" />

  <link rel="stylesheet" href="../../assets/css/style.css" />
  <link rel="stylesheet" href="../../assets/css/backdrops.css" />
  <link rel="stylesheet" href="../../assets/css/tool.css" />
</head>

<body>

  <div id="backdrop" aria-hidden="true">
    <div class="grid-bg__sky"></div>
    <div class="grid-bg__plane"></div>
    <div class="grid-bg__scan"></div>
    <div class="grid-bg__spot"></div>
  </div>

  <div class="page">

    <header class="site-header">
      <div class="shell site-header__inner">
        <a href="/" class="brand" aria-label="ranzlappen tools home">
          <span class="brand__mark" aria-hidden="true"><img src="../../assets/icon.png" alt="" width="32" height="32" /></span>
          <span class="brand__name">ranzlappen<span class="brand__sub"> / tools</span></span>
        </a>
        <div class="header-actions">
          <button type="button" class="theme-toggle" aria-label="Switch to light theme" aria-pressed="false" title="Toggle theme">
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg class="icon-sun"  viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          </button>
          <span class="site-header__meta">tools.ranzlappen.com</span>
        </div>
      </div>
    </header>

    <main class="tool-main">
      <div class="shell">

        <section class="tool-header">
          <a href="../../" class="tool-header__back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
            All tools
          </a>
          <div class="tool-title">
            <div class="tool-title__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8 L3 12 L7 16"/><path d="M17 8 L21 12 L17 16"/><path d="M14 4 L10 20"/></svg>
            </div>
            <div class="tool-title__text">
              <h1>Multi-Encoder</h1>
              <p>Type plain text on the left; every encoding updates live. Edit any output to decode back.</p>
            </div>
            <button type="button" class="info-btn" data-info-button aria-label="About this tool" title="About this tool">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/></svg>
            </button>
          </div>
        </section>

        <section class="panel stack-md">
          <div class="panel__head">
            <span class="panel__title">Plain text</span>
            <div class="btn-row">
              <button type="button" class="btn btn--ghost" data-action="sample">Sample</button>
              <button type="button" class="btn btn--ghost" data-action="clear">Clear</button>
            </div>
          </div>
          <textarea id="enc-plain" class="textarea" spellcheck="false" placeholder="Type or paste text…"></textarea>
        </section>

        <section class="panel stack-md" style="margin-top: var(--space-lg);">
          <div class="panel__head">
            <span class="panel__title">Encodings</span>
            <span class="panel__sub muted">Edit any field to round-trip back to plain text.</span>
          </div>

          <div style="display: grid; gap: var(--space-md);">
            <div>
              <label for="enc-b64" class="field-label">Base64</label>
              <textarea id="enc-b64" class="textarea" spellcheck="false" style="min-height: 80px;"></textarea>
            </div>
            <div>
              <label for="enc-hex" class="field-label">Hex</label>
              <textarea id="enc-hex" class="textarea" spellcheck="false" style="min-height: 80px;"></textarea>
            </div>
            <div>
              <label for="enc-url" class="field-label">URL encoded</label>
              <textarea id="enc-url" class="textarea" spellcheck="false" style="min-height: 80px;"></textarea>
            </div>
            <div>
              <label for="enc-bin" class="field-label">Binary (space-separated bytes)</label>
              <textarea id="enc-bin" class="textarea" spellcheck="false" style="min-height: 80px;"></textarea>
            </div>
            <div>
              <label for="enc-asc" class="field-label">ASCII codes (decimal, space-separated)</label>
              <textarea id="enc-asc" class="textarea" spellcheck="false" style="min-height: 80px;"></textarea>
            </div>
          </div>
        </section>

      </div>
    </main>

    <footer class="site-footer">
      <div class="shell site-footer__inner">
        <span>Built by <a href="https://ranzlappen.com">Ranzlappen</a>.</span>
        <span><a href="https://github.com/Ranzlappen/tools">source</a> · MIT licensed</span>
      </div>
    </footer>

  </div>


  <script type="module" src="../../assets/js/main.js"></script>
  <script type="module" src="../../assets/js/info-modal.js"></script>
  <script type="module" src="./tool.js"></script>
</body>
</html>
