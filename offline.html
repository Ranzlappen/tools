<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline · tools · ranzlappen</title>
  <meta name="theme-color" content="#0b1210" />
  <meta name="color-scheme" content="dark light" />
  <meta name="robots" content="noindex" />
  <!-- Self-contained: inline styles only, no external requests, so it
       renders while the device is offline. -->
  <style>
    :root {
      --bg: #0b1210;
      --surface: #15201b;
      --border: #253830;
      --text: #dce8e2;
      --muted: #7e948a;
      --accent: #4ade80;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      text-align: center;
    }
    .card {
      max-width: 28rem;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 2.5rem 1.75rem;
    }
    .icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 1.25rem;
      display: block;
    }
    h1 { margin: 0 0 0.5rem; font-size: 1.4rem; }
    p { margin: 0 0 1.5rem; color: var(--muted); }
    button {
      font: inherit;
      cursor: pointer;
      color: var(--bg);
      background: var(--accent);
      border: 0;
      border-radius: 8px;
      padding: 0.6rem 1.25rem;
      font-weight: 600;
    }
    button:hover { filter: brightness(1.08); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <main class="card">
    <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"
         fill="none" stroke="#4ade80" stroke-width="10" stroke-linecap="round"
         stroke-linejoin="round" aria-hidden="true">
      <path d="M12 28 L 38 28 L 38 62 L 12 62 M 38 45 L 90 45" />
    </svg>
    <h1>You're offline</h1>
    <p>This page isn't cached yet. Reconnect, then try again — tools you've
      already opened still work without a connection.</p>
    <button type="button" onclick="location.reload()">Retry</button>
  </main>
</body>
</html>
