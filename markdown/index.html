<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script>
    (function () {
      try {
        if (localStorage.getItem("tools:theme") === "light")
          document.documentElement.setAttribute("data-theme", "light");
        if (localStorage.getItem("tools:headerSticky") === "off")
          document.documentElement.setAttribute("data-header-sticky", "off");
        var CC_KEY = "tools:cookie_consent", CC_VER = 1, CC_EXP = 365;
        var d = JSON.parse(localStorage.getItem(CC_KEY));
        if (d && d.version === CC_VER && (Date.now() - d.timestamp) < CC_EXP * 86400000) {
          window.__cookieConsent = { functional: !!d.functional, resolved: true };
          if (d.functional) document.documentElement.classList.add("consent-functional");
        } else { window.__cookieConsent = { functional: false, resolved: false }; }
      } catch (e) { window.__cookieConsent = { functional: false, resolved: false }; }
    })();
  </script>

  <link rel="icon" type="image/png" href="/assets/icon.png" />
  <link rel="apple-touch-icon" href="/assets/icon.png" />

  <link rel="stylesheet" href="/assets/css/style.css" />
  <link rel="stylesheet" href="/assets/css/cookie-consent.css" />
  <link rel="stylesheet" href="/assets/css/backdrops.css" />
  <link rel="stylesheet" href="/assets/css/tool.css" />

  <!-- marked + DOMPurify pinned with SRI. Both are CDN-loaded; if SRI
       check fails (CDN tampering), the script silently fails to load
       and tool.js falls back to escaped plaintext. -->
  <script
    defer
    src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"
    integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  ></script>
  <script
    defer
    src="https://cdn.jsdelivr.net/npm/dompurify@3.0.11/dist/purify.min.js"
    integrity="sha384-Ic7KEGROu37YaruU6NyiYeib7UhjFyDZQ5fzBAji965L75T/4LGk5nzwMEjNGexs"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  ></script>
</head>

<body>

  <div id="backdrop" aria-hidden="true">
    <div class="grid-bg__sky"></div>
    <div class="grid-bg__plane"></div>
    <div class="grid-bg__scan"></div>
    <div class="grid-bg__spot"></div>
  </div>

  <div class="page">


    <main class="tool-main">
      <div class="shell">

        <section class="tool-header">
          <a href="/" class="tool-header__back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
            All tools
          </a>
          <div class="tool-title">
            <div class="tool-title__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 15V9l3 3 3-3v6"/><path d="M17 9v6M14 13l3 3 3-3"/></svg>
            </div>
            <div class="tool-title__text">
              <h1>Markdown Preview</h1>
              <p>Live GitHub-Flavored Markdown rendering, or import a file (HTML, CSV, JSON, DOCX, XLSX, PDF, PPTX) and convert it to Markdown.</p>
            </div>
            <button type="button" class="info-btn" data-info-button aria-label="About this tool" title="About this tool">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/></svg>
            </button>
          </div>
        </section>

        <div id="status" class="banner banner--info is-hidden">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>
          <span id="status-text"></span>
        </div>

        <section class="panel stack-md">
          <div class="panel__head">
            <span class="panel__title">Source · Preview</span>
            <div class="btn-row">
              <button type="button" class="btn" data-action="copy-html">Copy HTML</button>
              <button type="button" class="btn" data-action="copy-md">Copy Markdown</button>
              <button type="button" class="btn btn--ghost" data-action="download-md">Download .md</button>
              <button type="button" class="btn btn--ghost" data-action="sample">Sample</button>
              <button type="button" class="btn btn--ghost" data-action="clear">Clear</button>
            </div>
          </div>

          <div id="drop" class="drop-zone" tabindex="0" role="button" aria-label="Import a file to convert to Markdown">
            <input type="file" id="md-file" accept=".html,.htm,.xhtml,.csv,.tsv,.json,.txt,.md,.markdown,.docx,.xlsx,.pdf,.pptx,text/html,text/csv,application/json,text/plain,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/pdf,application/vnd.openxmlformats-officedocument.presentationml.presentation" hidden />
            <div class="drop-zone__inner">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><rect x="3" y="15" width="18" height="6" rx="2"/></svg>
              <div class="drop-zone__title">Drop a file to convert to Markdown</div>
              <div class="drop-zone__hint">or click to choose — HTML, CSV, JSON, TXT, DOCX, XLSX, PDF, PPTX</div>
            </div>
          </div>

          <div class="split">
            <div>
              <label for="md-in" class="field-label">Source</label>
              <textarea id="md-in" class="textarea" spellcheck="false" placeholder="# Hello&#10;Type some **Markdown**…"></textarea>
            </div>
            <div>
              <label class="field-label">Preview</label>
              <div id="md-out" class="md-preview" aria-live="polite"></div>
            </div>
          </div>
        </section>

      </div>
    </main>


  </div>


  <script defer src="/assets/js/partials.js"></script>
  <script defer src="/assets/js/cookie-consent.js"></script>
  <script defer src="/assets/js/search.js"></script>
  <script type="module" src="/assets/js/main.js"></script>
  <script type="module" src="/assets/js/info-modal.js"></script>
  <script type="module" src="./tool.js"></script>
</body>
</html>
