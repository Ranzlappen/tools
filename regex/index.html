  <script>
    (function () {
      try {
        if (localStorage.getItem("tools:theme") === "light")
          document.documentElement.setAttribute("data-theme", "light");
        if (localStorage.getItem("tools:headerSticky") === "off")
          document.documentElement.setAttribute("data-header-sticky", "off");
        var CC_KEY = "tools:cookie_consent", CC_VER = 1, CC_EXP = 365;
        var d = JSON.parse(localStorage.getItem(CC_KEY));
        if (d && d.version === CC_VER && (Date.now() - d.timestamp) < CC_EXP * 86400000) {
          window.__cookieConsent = { functional: !!d.functional, resolved: true };
          if (d.functional) document.documentElement.classList.add("consent-functional");
        } else { window.__cookieConsent = { functional: false, resolved: false }; }
      } catch (e) { window.__cookieConsent = { functional: false, resolved: false }; }
    })();
  </script>

  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />

  <link rel="stylesheet" href="/assets/css/backdrops.css" />
  <link rel="stylesheet" href="/assets/css/tool.css" />
</head>

<body>

  <div id="backdrop" aria-hidden="true">
    <div class="grid-bg__sky"></div>
    <div class="grid-bg__plane"></div>
    <div class="grid-bg__scan"></div>
    <div class="grid-bg__spot"></div>
  </div>

  <div class="page">


    <main class="tool-main">
      <div class="shell">

        <section class="tool-header">
          <a href="/" class="tool-header__back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
            All tools
          </a>
          <div class="tool-title">
            <div class="tool-title__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3v6m-3-3h6M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7"/><circle cx="7" cy="17" r="1"/></svg>
            </div>
            <div class="tool-title__text">
              <h1>Regex Tester &amp; Builder</h1>
              <p>Live match highlighting with a builder palette for the patterns you reach for most.</p>
            </div>
            <button type="button" class="info-btn" data-info-button aria-label="About this tool" title="About this tool">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/></svg>
            </button>
          </div>
        </section>

        <section class="panel stack-md">
          <div class="panel__head">
            <span class="panel__title">Pattern</span>
            <div class="chips" role="group" aria-label="Flags">
              <button class="chip" data-flag="g" aria-pressed="true">g · global</button>
              <button class="chip" data-flag="i" aria-pressed="false">i · ignore case</button>
              <button class="chip" data-flag="m" aria-pressed="false">m · multiline</button>
              <button class="chip" data-flag="s" aria-pressed="false">s · dotall</button>
              <button class="chip" data-flag="u" aria-pressed="false">u · unicode</button>
              <button class="chip" data-flag="y" aria-pressed="false">y · sticky</button>
            </div>
          </div>

          <div style="display: grid; grid-template-columns: auto 1fr auto; gap: var(--space-sm); align-items: center; font-family: var(--f-mono); margin-bottom: var(--space-md);">
            <span class="muted">/</span>
            <input id="re-pattern" class="input input--single input--mono" spellcheck="false" placeholder='e.g. \\b\\w+@\\w+\\.\\w+\\b' />
            <span class="muted">/<span id="re-flags">g</span></span>
          </div>

          <div class="regex-builder">
            <span class="panel__sub muted">Snippets — click to insert:</span>
            <div class="chips" id="re-snippets"></div>
          </div>

          <div id="re-error" class="banner banner--error is-hidden">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>
            <span id="re-error-text"></span>
          </div>
        </section>

        <section class="panel stack-md" style="margin-top: var(--space-lg);">
          <div class="panel__head">
            <span class="panel__title">Test string</span>
            <span id="re-count" class="panel__sub muted">No matches</span>
          </div>

          <div class="split">
            <div>
              <label for="re-input" class="field-label">Input</label>
              <textarea id="re-input" class="textarea" spellcheck="false" placeholder="Paste text to test against your pattern…"></textarea>
            </div>
            <div>
              <label class="field-label">Highlighted</label>
              <div id="re-highlight" class="textarea" style="white-space: pre-wrap; overflow: auto;" aria-live="polite"></div>
            </div>
          </div>

          <div>
            <label class="field-label">Matches</label>
            <ul id="re-matches" class="match-list"></ul>
          </div>

          <details>
            <summary class="muted tiny">Replace mode</summary>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-md); margin-top: var(--space-sm);">
              <input id="re-replace" class="input input--single input--mono" placeholder="Replacement text (supports $1, $2, $&)…" />
              <input id="re-replaced" class="input input--single input--mono" readonly placeholder="Result will appear here" />
            </div>
          </details>
        </section>

      </div>
    </main>


  </div>


  <script defer src="/assets/js/partials.js"></script>
  <script defer src="/assets/js/cookie-consent.js"></script>
  <script defer src="/assets/js/search.js"></script>
  <script type="module" src="/assets/js/main.js"></script>
  <script type="module" src="/assets/js/info-modal.js"></script>
  <script type="module" src="./tool.js"></script>
</body>
</html>
