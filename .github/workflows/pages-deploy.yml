name: pages-deploy

on:
  push:
    branches: [main]
    # Skip rebuilds when only Vercel-only paths change. Vercel handles
    # those out-of-band.
    paths-ignore:
      - 'api/**'
      - 'vercel.json'
      - '.vercelignore'
      - '.github/**'
      - '**/*.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          # If Pages isn't enabled yet, try to enable it automatically.
          # Requires the `pages: write` permission this workflow grants
          # and that you've at least once visited Settings → Pages on
          # the repo (GitHub requires an interactive bootstrap before
          # the API will accept enablement).
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
