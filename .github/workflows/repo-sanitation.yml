# Repo sanitation — manual cleanup of stale CI artifacts and pre-release tags.
#
# Triggered only by workflow_dispatch (never on push) so cleanup is
# always a deliberate, audited action with a clear actor.
#
# Default behavior is dry-run: prints what would be deleted. Pass
# `dry_run: false` from the manual run UI to actually delete.

name: Repo sanitation

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (report only, no deletion)"
        type: boolean
        default: true
      artifact_age_days:
        description: "Delete artifacts older than this many days"
        type: number
        default: 30
      keep_prerelease_count:
        description: "Keep this many newest pre-release tags (alpha/beta/rc)"
        type: number
        default: 5

permissions:
  contents: read

concurrency:
  group: repo-sanitation
  cancel-in-progress: false

jobs:
  artifacts:
    name: Sweep stale workflow artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: List + delete artifacts older than threshold
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          AGE_DAYS: ${{ inputs.artifact_age_days }}
        run: |
          set -euo pipefail
          cutoff=$(date -u -d "${AGE_DAYS} days ago" +%s)
          echo "Cutoff: artifacts created before ${AGE_DAYS} days ago (epoch ${cutoff})"
          gh api -X GET "repos/${{ github.repository }}/actions/artifacts" \
            --paginate \
            --jq '.artifacts[] | [.id, .name, .created_at, .size_in_bytes] | @tsv' |
          while IFS=$'\t' read -r id name created size; do
            created_ts=$(date -u -d "${created}" +%s)
            if [ "${created_ts}" -lt "${cutoff}" ]; then
              if [ "${DRY_RUN}" = "true" ]; then
                echo "DRY-RUN would delete: ${id}  ${name}  ${created}  ${size}B"
              else
                echo "Deleting: ${id}  ${name}  ${created}  ${size}B"
                gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/${id}"
              fi
            fi
          done

  prereleases:
    name: Trim stale pre-release tags
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Identify pre-release tags beyond the keep-window
        env:
          KEEP: ${{ inputs.keep_prerelease_count }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # Pre-release tags match vX.Y.Z-(alpha|beta|rc)*
          tags=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)' || true)
          if [ -z "${tags}" ]; then
            echo "No pre-release tags found."
            exit 0
          fi
          to_keep=$(echo "${tags}" | head -n "${KEEP}")
          to_delete=$(echo "${tags}" | tail -n +"$((KEEP + 1))" || true)
          if [ -z "${to_delete}" ]; then
            echo "Nothing to trim."
            exit 0
          fi
          echo "Keeping:"
          echo "${to_keep}" | sed 's/^/  /'
          echo "Would delete:"
          echo "${to_delete}" | sed 's/^/  /'
          if [ "${DRY_RUN}" = "true" ]; then
            echo "Dry-run: no tags pushed."
            exit 0
          fi
          for t in ${to_delete}; do
            echo "Deleting tag ${t} on remote"
            git push --delete origin "${t}" || echo "  (already gone)"
          done
