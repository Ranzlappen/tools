# Dependency review on every PR to main.
#
# Fails the PR if a dependency change introduces a vulnerability above
# `fail-on-severity` or violates the license policy. Comments a structured
# diff summary on the PR for visibility.
#
# Pair with `security-scan.yml` (CodeQL + gitleaks): this workflow is
# the per-PR gate; security-scan.yml is the deeper sweep.

name: Dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Run dependency-review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
