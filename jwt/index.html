  <script>
    (function () {
      try {
        if (localStorage.getItem("tools:theme") === "light")
          document.documentElement.setAttribute("data-theme", "light");
        if (localStorage.getItem("tools:headerSticky") === "off")
          document.documentElement.setAttribute("data-header-sticky", "off");
        var CC_KEY = "tools:cookie_consent", CC_VER = 1, CC_EXP = 365;
        var d = JSON.parse(localStorage.getItem(CC_KEY));
        if (d && d.version === CC_VER && (Date.now() - d.timestamp) < CC_EXP * 86400000) {
          window.__cookieConsent = { functional: !!d.functional, resolved: true };
          if (d.functional) document.documentElement.classList.add("consent-functional");
        } else { window.__cookieConsent = { functional: false, resolved: false }; }
      } catch (e) { window.__cookieConsent = { functional: false, resolved: false }; }
    })();
  </script>

<body>

  <div id="backdrop" aria-hidden="true">
    <div class="grid-bg__sky"></div>
    <div class="grid-bg__plane"></div>
    <div class="grid-bg__scan"></div>
    <div class="grid-bg__spot"></div>
  </div>

  <div class="page">


    <main class="tool-main">
      <div class="shell">

        <section class="tool-header">
          <a href="/" class="tool-header__back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
            All tools
          </a>
          <div class="tool-title">
            <div class="tool-title__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/><circle cx="12" cy="16" r="1.2"/></svg>
            </div>
            <div class="tool-title__text">
              <h1>JWT Decoder</h1>
              <p>Inspect a JSON Web Token's header and payload. Nothing leaves the page.</p>
            </div>
            <button type="button" class="info-btn" data-info-button aria-label="About this tool" title="About this tool">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/></svg>
            </button>
          </div>
        </section>

        <div class="banner banner--warn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg>
          <span><strong>Signature is not verified.</strong> Anyone can craft a token with the same claims — only use this tool for inspection, never for trust decisions.</span>
        </div>

        <section class="panel stack-md">
          <div class="panel__head">
            <span class="panel__title">Token</span>
            <div class="btn-row">
              <button type="button" class="btn btn--ghost" data-action="sample">Sample</button>
              <button type="button" class="btn btn--ghost" data-action="clear">Clear</button>
            </div>
          </div>
          <textarea id="jwt-in" class="textarea" spellcheck="false" placeholder="eyJhbGciOi…" style="min-height: 140px;"></textarea>

          <div id="jwt-expiry" class="banner is-hidden">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
            <span id="jwt-expiry-text"></span>
          </div>
        </section>

        <section class="jwt-segments" style="margin-top: var(--space-lg);">
          <div class="jwt-segment">
            <div class="jwt-segment__label">Header</div>
            <pre id="jwt-header">—</pre>
          </div>
          <div class="jwt-segment">
            <div class="jwt-segment__label">Payload</div>
            <pre id="jwt-payload">—</pre>
          </div>
          <div class="jwt-segment">
            <div class="jwt-segment__label">Signature (raw base64url)</div>
            <pre id="jwt-signature">—</pre>
          </div>
        </section>

      </div>
    </main>
