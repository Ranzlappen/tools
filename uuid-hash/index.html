  <script>
    (function () {
      try {
        if (localStorage.getItem("tools:theme") === "light")
          document.documentElement.setAttribute("data-theme", "light");
        if (localStorage.getItem("tools:headerSticky") === "off")
          document.documentElement.setAttribute("data-header-sticky", "off");
        var CC_KEY = "tools:cookie_consent", CC_VER = 1, CC_EXP = 365;
        var d = JSON.parse(localStorage.getItem(CC_KEY));
        if (d && d.version === CC_VER && (Date.now() - d.timestamp) < CC_EXP * 86400000) {
          window.__cookieConsent = { functional: !!d.functional, resolved: true };
          if (d.functional) document.documentElement.classList.add("consent-functional");
        } else { window.__cookieConsent = { functional: false, resolved: false }; }
      } catch (e) { window.__cookieConsent = { functional: false, resolved: false }; }
    })();
  </script>

<body>

  <div id="backdrop" aria-hidden="true">
    <div class="grid-bg__sky"></div>
    <div class="grid-bg__plane"></div>
    <div class="grid-bg__scan"></div>
    <div class="grid-bg__spot"></div>
  </div>

  <div class="page">


    <main class="tool-main">
      <div class="shell">

        <section class="tool-header">
          <a href="/" class="tool-header__back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
            All tools
          </a>
          <div class="tool-title">
            <div class="tool-title__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h10"/><circle cx="19" cy="17" r="2.2"/></svg>
            </div>
            <div class="tool-title__text">
              <h1>UUID &amp; Hash Generator</h1>
              <p>UUID v4 / v7 generation, plus MD5 / SHA-1 / SHA-256 / SHA-384 / SHA-512 hashes.</p>
            </div>
            <button type="button" class="info-btn" data-info-button aria-label="About this tool" title="About this tool">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/></svg>
            </button>
          </div>
        </section>

        <section class="panel stack-md">
          <div class="panel__head">
            <span class="panel__title">UUID</span>
            <div class="btn-row">
              <button type="button" class="btn btn--primary" data-action="uuid-v4">New v4</button>
              <button type="button" class="btn" data-action="uuid-v7">New v7</button>
            </div>
          </div>

          <div class="kv-list">
            <div class="kv-row">
              <span class="k">v4</span>
              <span class="v" id="uuid-v4">—</span>
              <button class="btn btn--ghost btn--copy" data-copy-from="uuid-v4">Copy</button>
            </div>
            <div class="kv-row">
              <span class="k">v7</span>
              <span class="v" id="uuid-v7">—</span>
              <button class="btn btn--ghost btn--copy" data-copy-from="uuid-v7">Copy</button>
            </div>
          </div>

          <details>
            <summary class="muted tiny">Batch generator</summary>
            <div style="display: grid; grid-template-columns: auto auto auto 1fr; gap: var(--space-sm); align-items: center; margin-top: var(--space-sm);">
              <label class="field-label" style="margin: 0;">Count</label>
              <input id="uuid-count" type="number" min="1" max="100" value="10" class="input input--single input--mono" style="width: 80px;" />
              <select id="uuid-version" class="input input--single input--mono" style="width: 80px;">
                <option value="v4">v4</option>
                <option value="v7">v7</option>
              </select>
              <button class="btn" data-action="uuid-batch">Generate</button>
            </div>
            <textarea id="uuid-batch-out" class="textarea" readonly placeholder="Batch output will appear here…" style="margin-top: var(--space-sm); min-height: 140px;"></textarea>
          </details>
        </section>

        <section class="panel stack-md" style="margin-top: var(--space-lg);">
          <div class="panel__head">
            <span class="panel__title">Hashes</span>
            <span class="panel__sub muted">Updates as you type.</span>
          </div>

          <label for="hash-in" class="field-label">Input</label>
          <textarea id="hash-in" class="textarea" spellcheck="false" placeholder="Type or paste text…" style="min-height: 120px;"></textarea>

          <div class="kv-list" style="margin-top: var(--space-md);">
            <div class="kv-row">
              <span class="k">MD5</span>
              <span class="v" id="h-md5">—</span>
              <button class="btn btn--ghost btn--copy" data-copy-from="h-md5">Copy</button>
            </div>
            <div class="kv-row">
              <span class="k">SHA-1</span>
              <span class="v" id="h-sha1">—</span>
              <button class="btn btn--ghost btn--copy" data-copy-from="h-sha1">Copy</button>
            </div>
            <div class="kv-row">
              <span class="k">SHA-256</span>
              <span class="v" id="h-sha256">—</span>
              <button class="btn btn--ghost btn--copy" data-copy-from="h-sha256">Copy</button>
            </div>
            <div class="kv-row">
              <span class="k">SHA-384</span>
              <span class="v" id="h-sha384">—</span>
              <button class="btn btn--ghost btn--copy" data-copy-from="h-sha384">Copy</button>
            </div>
            <div class="kv-row">
              <span class="k">SHA-512</span>
              <span class="v" id="h-sha512">—</span>
              <button class="btn btn--ghost btn--copy" data-copy-from="h-sha512">Copy</button>
            </div>
          </div>
        </section>

      </div>
    </main>


  </div>
