  <script>
    (function () {
      try {
        if (localStorage.getItem("tools:theme") === "light")
          document.documentElement.setAttribute("data-theme", "light");
        if (localStorage.getItem("tools:headerSticky") === "off")
          document.documentElement.setAttribute("data-header-sticky", "off");
        var CC_KEY = "tools:cookie_consent", CC_VER = 1, CC_EXP = 365;
        var d = JSON.parse(localStorage.getItem(CC_KEY));
        if (d && d.version === CC_VER && (Date.now() - d.timestamp) < CC_EXP * 86400000) {
          window.__cookieConsent = { functional: !!d.functional, resolved: true };
          if (d.functional) document.documentElement.classList.add("consent-functional");
        } else { window.__cookieConsent = { functional: false, resolved: false }; }
      } catch (e) { window.__cookieConsent = { functional: false, resolved: false }; }
    })();
  </script>

  <link rel="icon" href="/icons/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />

  <link rel="stylesheet" href="/assets/css/style.css" />

</head>

<body>

  <div id="backdrop" aria-hidden="true">
    <div class="grid-bg__sky"></div>
    <div class="grid-bg__plane"></div>
    <div class="grid-bg__scan"></div>
    <div class="grid-bg__spot"></div>
  </div>

  <div class="page">


    <main class="tool-main">
      <div class="shell">

        <section class="tool-header">
          <a href="/" class="tool-header__back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
            All tools
          </a>
          <div class="tool-title">
            <div class="tool-title__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8 L3 12 L7 16"/><path d="M17 8 L21 12 L17 16"/><path d="M14 4 L10 20"/></svg>
            </div>
            <div class="tool-title__text">
              <h1>Multi-Encoder</h1>
              <p>Type plain text on the left; every encoding updates live. Edit any output to decode back.</p>
            </div>
            <button type="button" class="info-btn" data-info-button aria-label="About this tool" title="About this tool">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/></svg>
            </button>
          </div>
        </section>

        <section class="panel stack-md">
          <div class="panel__head">
            <span class="panel__title">Plain text</span>
            <div class="btn-row">
              <button type="button" class="btn btn--ghost" data-action="sample">Sample</button>
              <button type="button" class="btn btn--ghost" data-action="clear">Clear</button>
            </div>
          </div>
          <textarea id="enc-plain" class="textarea" spellcheck="false" placeholder="Type or paste text…"></textarea>
        </section>

        <section class="panel stack-md" style="margin-top: var(--space-lg);">
          <div class="panel__head">
            <span class="panel__title">Encodings</span>
            <span class="panel__sub muted">Edit any field to round-trip back to plain text.</span>
          </div>

          <div style="display: grid; gap: var(--space-md);">
            <div>
              <label for="enc-b64" class="field-label">Base64</label>
              <textarea id="enc-b64" class="textarea" spellcheck="false" style="min-height: 80px;"></textarea>
            </div>
            <div>
              <label for="enc-hex" class="field-label">Hex</label>
              <textarea id="enc-hex" class="textarea" spellcheck="false" style="min-height: 80px;"></textarea>
            </div>
            <div>
              <label for="enc-url" class="field-label">URL encoded</label>
              <textarea id="enc-url" class="textarea" spellcheck="false" style="min-height: 80px;"></textarea>
            </div>
            <div>
              <label for="enc-bin" class="field-label">Binary (space-separated bytes)</label>
              <textarea id="enc-bin" class="textarea" spellcheck="false" style="min-height: 80px;"></textarea>
            </div>
            <div>
              <label for="enc-asc" class="field-label">ASCII codes (decimal, space-separated)</label>
              <textarea id="enc-asc" class="textarea" spellcheck="false" style="min-height: 80px;"></textarea>
            </div>
          </div>
        </section>

      </div>
    </main>


  </div>


  <script defer src="/assets/js/partials.js"></script>
  <script defer src="/assets/js/cookie-consent.js"></script>
  <script defer src="/assets/js/search.js"></script>
  <script type="module" src="/assets/js/main.js"></script>
  <script type="module" src="/assets/js/info-modal.js"></script>
  <script type="module" src="./tool.js"></script>
</body>
</html>
