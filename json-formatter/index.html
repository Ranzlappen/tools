  <script>
    (function () {
      try {
        if (localStorage.getItem("tools:theme") === "light")
          document.documentElement.setAttribute("data-theme", "light");
        if (localStorage.getItem("tools:headerSticky") === "off")
          document.documentElement.setAttribute("data-header-sticky", "off");
        var CC_KEY = "tools:cookie_consent", CC_VER = 1, CC_EXP = 365;
        var d = JSON.parse(localStorage.getItem(CC_KEY));
        if (d && d.version === CC_VER && (Date.now() - d.timestamp) < CC_EXP * 86400000) {
          window.__cookieConsent = { functional: !!d.functional, resolved: true };
          if (d.functional) document.documentElement.classList.add("consent-functional");
        } else { window.__cookieConsent = { functional: false, resolved: false }; }
      } catch (e) { window.__cookieConsent = { functional: false, resolved: false }; }
    })();
  </script>

  <link rel="icon" type="image/png" href="/assets/icon.png" />
  <link rel="apple-touch-icon" href="/assets/icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <meta name="apple-mobile-web-app-capable" content="yes" />

<body>

  <div id="backdrop" aria-hidden="true">
    <div class="grid-bg__sky"></div>
    <div class="grid-bg__plane"></div>
    <div class="grid-bg__scan"></div>
    <div class="grid-bg__spot"></div>
  </div>

  <div class="page">


    <main class="tool-main">
      <div class="shell">

        <section class="tool-header">
          <a href="/" class="tool-header__back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
            All tools
          </a>
          <div class="tool-title">
            <div class="tool-title__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4H6a2 2 0 0 0-2 2v3a2 2 0 0 1-2 2 2 2 0 0 1 2 2v3a2 2 0 0 0 2 2h2"/><path d="M16 4h2a2 2 0 0 1 2 2v3a2 2 0 0 0 2 2 2 2 0 0 0-2 2v3a2 2 0 0 1-2 2h-2"/></svg>
            </div>
            <div class="tool-title__text">
              <h1>JSON Formatter</h1>
              <p>Pretty-print, minify, and validate JSON — runs entirely in your browser.</p>
            </div>
            <button type="button" class="info-btn" data-info-button aria-label="About this tool" title="About this tool">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/></svg>
            </button>
          </div>
        </section>

        <div id="status" class="banner banner--info is-hidden">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>
          <span id="status-text"></span>
        </div>

        <section class="panel stack-md">
          <div class="panel__head">
            <span class="panel__title">Input · Output</span>
            <div class="btn-row">
              <button type="button" class="btn btn--primary" data-action="format">Format</button>
              <button type="button" class="btn" data-action="minify">Minify</button>
              <button type="button" class="btn" data-action="validate">Validate</button>
              <button type="button" class="btn btn--ghost" data-action="sample">Sample</button>
              <button type="button" class="btn btn--ghost" data-action="clear">Clear</button>
              <button type="button" class="btn btn--copy" data-action="copy">Copy output</button>
            </div>
          </div>

          <div class="split">
            <div>
              <label for="json-in" class="field-label">Input</label>
              <textarea id="json-in" class="textarea" spellcheck="false" placeholder='{"hello": "world"}'></textarea>
            </div>
            <div>
              <label for="json-out" class="field-label">Output</label>
              <textarea id="json-out" class="textarea" spellcheck="false" readonly></textarea>
            </div>
          </div>
        </section>

      </div>
    </main>


  </div>


  <script defer src="/assets/js/partials.js"></script>
  <script defer src="/assets/js/cookie-consent.js"></script>
  <script defer src="/assets/js/search.js"></script>
  <script type="module" src="/assets/js/main.js"></script>

  <script type="module" src="./tool.js"></script>
</body>
